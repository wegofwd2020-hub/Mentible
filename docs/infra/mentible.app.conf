# =============================================================================
# mentible.app — host-level nginx vhost (Cloudflare Origin Cert)
#
# The Mentible app's own apex domain. D1 = same-origin `/api`, D2 = app at root.
# See the Mentible repo docs/DOMAIN_MIGRATION_mentible_app.md §6 for the plan.
#
# Same two-layer design as mambakkam.net.conf:
#   Internet → Cloudflare (TLS, "Full (strict)") → :443 here
#     ├─ /            → 127.0.0.1:8001  (astrowind container; Host: mentible.app
#     │                                  routes to its `server_name mentible.app`
#     │                                  block, serving public/mentible-app/ at root)
#     └─ /api/        → 127.0.0.1:8001  (Mentible backend — SAME-ORIGIN, no CORS)
#
# Lives at /etc/nginx/sites-available/mentible.app.conf, symlinked from
# sites-enabled/. Installed by scripts/launch/provision.sh; reloaded manually by
# the operator after edits (NOT auto-deployed — a syntax error would take down
# the co-tenant mambakkam.net + StudyBuddy stacks too).
#
# ── PREREQUISITES (or this vhost fails) ─────────────────────────────────────
#   1. DNS: mentible.app (+ www) proxied through Cloudflare → this VPS.
#   2. A DEDICATED Cloudflare Origin Cert for mentible.app (+ *.mentible.app),
#      installed at /etc/ssl/cloudflare/mentible-app-origin-{cert,key}.pem, or the
#      Full(strict) TLS handshake fails. Create it in the mentible.app zone
#      (SSL/TLS → Origin Server → Create Certificate) — kept SEPARATE from the
#      shared mambakkam.net/demo cert so this vhost can't disturb those sites.
#   3. The app must be published to the container: `web-deploy.sh mentible`
#      (Mentible repo) writes public/mentible-app/ → dist/mentible-app/.
# =============================================================================

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mentible.app www.mentible.app;
    # Cloudflare "Always Use HTTPS" handles this at the edge; redirect at origin
    # too in case anyone hits the VPS IP directly.
    return 301 https://mentible.app$request_uri;
}

# ── www → apex redirect ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mentible.app;

    ssl_certificate     /etc/ssl/cloudflare/mentible-app-origin-cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mentible-app-origin-key.pem;

    return 301 https://mentible.app$request_uri;
}

# ── apex — the Mentible app ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mentible.app;

    ssl_certificate     /etc/ssl/cloudflare/mentible-app-origin-cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mentible-app-origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/mentible.app.access.log;
    error_log  /var/log/nginx/mentible.app.error.log;

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    # ── Long-cache the content-hashed Expo assets ─────────────────────────
    # The Expo web export emits /_expo/*.js and /assets/* with content-hashed
    # names — safe to cache forever (the name changes on every rebuild). The
    # container's mentible.app block does the real serve (and returns a genuine
    # 404 for a missing asset instead of falling back to index.html — the
    # CDN-cache-poisoning guard); here we just pin the immutable cache header.
    location ~ ^/(_expo|assets)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── /api/ — Mentible backend (same-origin, no CORS) ───────────────────
    # No trailing slash on proxy_pass, so the full URI (/api/v1/…) passes
    # through unchanged to the backend, which serves under /api/v1/*. The app
    # bakes EXPO_PUBLIC_API_BASE_URL=https://mentible.app/api (web-deploy.sh
    # `mentible` target).
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # POST /export renders for minutes when diagrams=true; book payloads are large.
        proxy_read_timeout 300s;
        client_max_body_size 60m;
    }

    # ── Everything else → the container (vhosts on Host: mentible.app) ─────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
