# =============================================================================
# docker-compose.demo.yml — Mentible backend, production-shaped for the shared
# Hetzner VPS that also hosts mambakkam.net + the StudyBuddy demo.
#
# Used ALONE (not layered on docker-compose.yml — the dev one publishes
# 0.0.0.0:8001, mounts source, and runs uvicorn --reload, none of which are
# safe on a public box).
#
# Fronted by the mambakkam.net host nginx: it proxies the same-origin path
#   https://mambakkam.net/mentible-api/  →  127.0.0.1:8092  (this api container)
# so there is NO new subdomain, DNS record, Origin Cert SAN, or CORS to manage.
# See mambakkam-net/infra/nginx/mambakkam.net.conf (location /mentible-api/)
# and the runbook mambakkam-net/docs/DEMO_mentible_lite.md.
#
# Run on the VPS as:
#   docker compose -f docker-compose.demo.yml --env-file .env.demo \
#     up -d --build --remove-orphans
#
# .env.demo must set BYOK_MASTER_KEY (64 hex chars). Generate once with:
#   openssl rand -hex 32
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: mentible-redis
    restart: always
    # No host port published — only the api container (same compose network)
    # reaches it. Keeps Redis off the public interface entirely.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 96M

  api:
    image: mentible-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mentible-api
    restart: always
    ports:
      # Bind to localhost ONLY — the host nginx terminates TLS and proxies in.
      # Never publish to 0.0.0.0 (that would bypass Cloudflare + host nginx).
      - '127.0.0.1:8092:8000'
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      # Required — encrypts server-side BYOK material. No insecure default here
      # (the dev compose ships a zero key; production must supply a real one).
      BYOK_MASTER_KEY: ${BYOK_MASTER_KEY:?set BYOK_MASTER_KEY in .env.demo (openssl rand -hex 32)}
      # Required — system-owner secret (ADR-018). No insecure default; production
      # must supply a real one.
      SYSTEM_OWNER_SECRET: ${SYSTEM_OWNER_SECRET:?set SYSTEM_OWNER_SECRET in .env.demo (openssl rand -hex 32)}
      ANTHROPIC_DEFAULT_MODEL: claude-sonnet-4-6
      # ── User identity + accounts (ADR-014) — OPTIONAL ─────────────────────
      # Empty ⇒ the anonymous demo (no login, no DB). Set OIDC_ISSUER +
      # DATABASE_URL in .env.demo to turn identity ON (go-live; see
      # docs/GO_LIVE.md), then run `alembic upgrade head` against DATABASE_URL.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-authenticated}
      DATABASE_URL: ${DATABASE_URL:-}
      # ── Super-admin operator allowlist (ADR-020 D1) — OPTIONAL ────────────
      # Empty ⇒ no admins. Comma-separated verified emails (case-insensitive).
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      SUPER_ADMIN_SUBS: ${SUPER_ADMIN_SUBS:-}
      # ── Managed billing (ADR-005 D6) — grant testers Pro + keyless managed gen ──
      # MANAGED_ANTHROPIC_API_KEY is OUR provider credential (ADR-001 discipline);
      # empty ⇒ managed off (testers fall back to BYOK). MANAGED_PLAN_EMAILS/SUBS =
      # the staff-allowlist cohort ⇒ Pro. The spend ceiling backstops even an
      # "unlimited" plan (0 ⇒ uncapped). FREE_* tune the Free caps without a rebuild.
      MANAGED_ANTHROPIC_API_KEY: ${MANAGED_ANTHROPIC_API_KEY:-}
      # MANAGED_GROQ_API_KEY is the default managed engine (ADR-005/037): without this
      # passthrough the container never sees the key even if it's in .env.demo, and
      # every managed Groq generation fails "managed generation unavailable" at the
      # worker. GROQ_MAX_OUTPUT_TOKENS is optional (code default 5000, the free-tier
      # TPM cap) — passed through so the free→Dev-tier upgrade (raise/0-disable) is a
      # pure .env edit, no compose change. (GROQ_DEFAULT_MODEL is intentionally NOT
      # passed: an empty env value would override the code default with "" and break
      # model resolution — set it in code, not env.)
      MANAGED_GROQ_API_KEY: ${MANAGED_GROQ_API_KEY:-}
      GROQ_MAX_OUTPUT_TOKENS: ${GROQ_MAX_OUTPUT_TOKENS:-5000}
      GROQ_TPM_LIMIT: ${GROQ_TPM_LIMIT:-8000}
      MANAGED_PLAN_EMAILS: ${MANAGED_PLAN_EMAILS:-}
      MANAGED_PLAN_SUBS: ${MANAGED_PLAN_SUBS:-}
      MANAGED_ACCOUNT_SPEND_CEILING_MICROS: ${MANAGED_ACCOUNT_SPEND_CEILING_MICROS:-0}
      FREE_MAX_PROJECTS: ${FREE_MAX_PROJECTS:-2}
      FREE_MAX_GENERATIONS: ${FREE_MAX_GENERATIONS:-20}
      FREE_GEN_WINDOW_DAYS: ${FREE_GEN_WINDOW_DAYS:-30}
      # ── Open Library (ADR-027) — published artifacts live on a persistent
      # volume so a redeploy doesn't orphan the published_artifact registry rows.
      ARTIFACT_STORE_DIR: /data/artifacts
    volumes:
      - mentible-artifacts:/data/artifacts
    depends_on:
      redis:
        condition: service_healthy
    # Uses the image's default CMD (uvicorn ... :8000, no --reload).
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        # Capped so a runaway render can't starve the co-tenant village +
        # StudyBuddy stacks on the small shared box. Memory must clear a headless
        # Chromium/Vivliostyle PDF pass over a full book — 384M OOM-killed the
        # Vivliostyle child (exit 1, empty stderr) on the async PDF export, so it
        # is raised to 1.5G (host has ~1.9G free). CPU stays modest; a slow
        # off-request compile is fine now that export is an async job.
        limits:
          cpus: '0.75'
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  celery-worker:
    # Durable worker (Phase A trust-async-gen — task_acks_late in
    # backend/src/core/celery_app.py). Same image as `api`; only the command
    # differs — this is a Celery worker process, not the FastAPI server, but it
    # imports the same backend package so it needs the same environment.
    image: mentible-backend:latest
    container_name: mentible-celery-worker
    restart: always
    command:
      [
        'celery',
        '-A',
        'backend.src.core.celery_app',
        'worker',
        '--loglevel=INFO',
        '--concurrency=2',
      ]
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      # Required — encrypts server-side BYOK material. No insecure default here
      # (the dev compose ships a zero key; production must supply a real one).
      BYOK_MASTER_KEY: ${BYOK_MASTER_KEY:?set BYOK_MASTER_KEY in .env.demo (openssl rand -hex 32)}
      # Required — system-owner secret (ADR-018). No insecure default; production
      # must supply a real one.
      SYSTEM_OWNER_SECRET: ${SYSTEM_OWNER_SECRET:?set SYSTEM_OWNER_SECRET in .env.demo (openssl rand -hex 32)}
      ANTHROPIC_DEFAULT_MODEL: claude-sonnet-4-6
      # ── User identity + accounts (ADR-014) — OPTIONAL ─────────────────────
      # Empty ⇒ the anonymous demo (no login, no DB). Set OIDC_ISSUER +
      # DATABASE_URL in .env.demo to turn identity ON (go-live; see
      # docs/GO_LIVE.md), then run `alembic upgrade head` against DATABASE_URL.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-authenticated}
      DATABASE_URL: ${DATABASE_URL:-}
      # ── Super-admin operator allowlist (ADR-020 D1) — OPTIONAL ────────────
      # Empty ⇒ no admins. Comma-separated verified emails (case-insensitive).
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      SUPER_ADMIN_SUBS: ${SUPER_ADMIN_SUBS:-}
      # ── Managed billing (ADR-005 D6) — grant testers Pro + keyless managed gen ──
      # MANAGED_ANTHROPIC_API_KEY is OUR provider credential (ADR-001 discipline);
      # empty ⇒ managed off (testers fall back to BYOK). MANAGED_PLAN_EMAILS/SUBS =
      # the staff-allowlist cohort ⇒ Pro. The spend ceiling backstops even an
      # "unlimited" plan (0 ⇒ uncapped). FREE_* tune the Free caps without a rebuild.
      MANAGED_ANTHROPIC_API_KEY: ${MANAGED_ANTHROPIC_API_KEY:-}
      # MANAGED_GROQ_API_KEY is the default managed engine (ADR-005/037): without this
      # passthrough the container never sees the key even if it's in .env.demo, and
      # every managed Groq generation fails "managed generation unavailable" at the
      # worker. GROQ_MAX_OUTPUT_TOKENS is optional (code default 5000, the free-tier
      # TPM cap) — passed through so the free→Dev-tier upgrade (raise/0-disable) is a
      # pure .env edit, no compose change. (GROQ_DEFAULT_MODEL is intentionally NOT
      # passed: an empty env value would override the code default with "" and break
      # model resolution — set it in code, not env.)
      MANAGED_GROQ_API_KEY: ${MANAGED_GROQ_API_KEY:-}
      GROQ_MAX_OUTPUT_TOKENS: ${GROQ_MAX_OUTPUT_TOKENS:-5000}
      GROQ_TPM_LIMIT: ${GROQ_TPM_LIMIT:-8000}
      MANAGED_PLAN_EMAILS: ${MANAGED_PLAN_EMAILS:-}
      MANAGED_PLAN_SUBS: ${MANAGED_PLAN_SUBS:-}
      MANAGED_ACCOUNT_SPEND_CEILING_MICROS: ${MANAGED_ACCOUNT_SPEND_CEILING_MICROS:-0}
      FREE_MAX_PROJECTS: ${FREE_MAX_PROJECTS:-2}
      FREE_MAX_GENERATIONS: ${FREE_MAX_GENERATIONS:-20}
      FREE_GEN_WINDOW_DAYS: ${FREE_GEN_WINDOW_DAYS:-30}
      # ── Open Library (ADR-027) ─────────────────────────────────────────────
      # Mirrored from `api` for import-time parity even though this worker
      # doesn't (yet) touch the artifact store — no volume mount below since
      # per-topic generation (T2) doesn't read/write it.
      ARTIFACT_STORE_DIR: /data/artifacts
    depends_on:
      redis:
        condition: service_healthy
    # No `ports:` — a worker has nothing to serve.
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

# Named volume for the Open Library's published artifacts (ADR-027). Persists
# across container rebuilds/redeploys so the published_artifact rows keep their
# files.
volumes:
  mentible-artifacts:
